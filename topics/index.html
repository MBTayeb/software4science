<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <title></title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="stylesheet" href="../assets/monokai.css" />
    <script src="../assets/highlight.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a href="../" class="site-link">
        <div class="site-title-div">
          <span class="site-prefix" aria-hidden="true">&gt;</span>
          <span class="site-title">S4S</span>
        </div>
      </a>
      <div id="theme-toggle-parent">
        <button id="theme-toggle">Toggle Dark Mode</button>
      </div>
    </header>
    <script src="../assets/dark.js" defer></script>
    <h1 id="printed-title">Loading ...</h1>
    <div id="topics-placeholder" class="daughter-lists-bigger"></div>
    <script src="../assets/manifest-nav.js"></script>
    <script src="../assets/topics_filler.js"></script>
    <script>
      fetch("title.txt")
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Failed to load title.txt: ${response.status}`);
          }
          return response.text();
        })
        .then((text) => {
          const title = text.trim();
          document.getElementById("printed-title").textContent = title;
          document.title = title;
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("printed-title").textContent =
            "Error loading title";
        });
      TopicsPage.load("topics-placeholder", false, "../");
    </script>
  </body>
</html>
